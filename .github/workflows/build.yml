name: Build README
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "README.md"]
  pull_request:
    paths: ["data/**", "scripts/**"]
  schedule:
    - cron: "0 0 * * *" # daily: fetch new postings, auto-close expired ones, refresh 🆕/🔥 markers
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch postings from company job boards
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch.py
      - run: python scripts/build.py
      - name: Commit regenerated README
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/internships.json
          git diff --cached --quiet || (git commit -m "chore: daily update" && git push)
